name: Read existing public research website
on:
  push:
    paths:
      - '.github/workflows/source-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-public-source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read the existing Google Sites pages
        shell: python
        run: |
          import json, re, urllib.request, urllib.parse
          from html.parser import HTMLParser
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__(); self.skip=0; self.text=[]; self.links=[]; self.href=None; self.label=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag in ('script','style'): self.skip+=1
                  if tag=='a': self.href=a.get('href'); self.label=[]
                  if tag in ('p','div','h1','h2','h3','h4','li','br','tr'): self.text.append('\n')
              def handle_endtag(self, tag):
                  if tag in ('script','style'): self.skip=max(0,self.skip-1)
                  if tag=='a' and self.href:
                      self.links.append((' '.join(self.label),self.href)); self.href=None
              def handle_data(self, data):
                  if not self.skip:
                      self.text.append(data)
                      if self.href: self.label.append(data.strip())
          prefix='https://sites.google.com/view/md-miya/'
          for title in ('ホーム','自己紹介','研究紹介','研究業績'):
              url=prefix+urllib.parse.quote(title)
              print('\n=== SOURCE PAGE: '+url+' ===',flush=True)
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; personal-website-migration)'})
              with urllib.request.urlopen(req,timeout=25) as response:
                  print('HTTP',response.status,'FINAL_URL',response.url,flush=True)
                  raw=response.read(5000000).decode('utf-8','replace')
              page=Page(); page.feed(raw)
              text=re.sub(r'[ \t]+',' ',''.join(page.text))
              text=re.sub(r'\n\s*\n+','\n',text)
              print(text[:160000],flush=True)
              print('LINKS_JSON '+json.dumps(page.links,ensure_ascii=False),flush=True)
